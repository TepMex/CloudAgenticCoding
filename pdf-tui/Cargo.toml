[package]
name = "pdf-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A monochrome, character-only PDF viewer for Unix terminals"
license = "MIT"

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
signal-hook = "0.3"
hayro = "0.9.0"

[profile.release]
lto = "thin"
strip = true

