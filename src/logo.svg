<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Socratus</title>
  <desc id="desc">Owl of Athena on an antique medallion, symbol of wisdom and inquiry.</desc>
  <defs>
    <linearGradient id="medallion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a8a"/>
      <stop offset="55%" stop-color="#1e405a"/>
      <stop offset="100%" stop-color="#152f42"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d5a8"/>
      <stop offset="40%" stop-color="#c9a75f"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
  </defs>
  <!-- outer ring / sun motif -->
  <circle cx="256" cy="256" r="248" fill="url(#medallion)"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.85"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#c9a75f" stroke-width="2" opacity="0.35"/>
  <!-- subtle Ionic-inspired radiating lines -->
  <g stroke="#c9a75f" stroke-width="2" stroke-opacity="0.2" fill="none">
    <line x1="256" y1="42" x2="256" y2="72"/>
    <line x1="256" y1="440" x2="256" y2="470"/>
    <line x1="42" y1="256" x2="72" y2="256"/>
    <line x1="440" y1="256" x2="470" y2="256"/>
    <line x1="96" y1="96" x2="118" y2="118"/>
    <line x1="394" y1="394" x2="416" y2="416"/>
    <line x1="416" y1="96" x2="394" y2="118"/>
    <line x1="118" y1="416" x2="96" y2="394"/>
  </g>
  <!-- Owl of Athena (stylized, readable at 16px) -->
  <g fill="url(#gold)" stroke="#152f42" stroke-width="4" stroke-linejoin="round">
    <!-- body -->
    <path d="M256 148c-48 0-88 38-92 86v10c0 22 12 42 30 54v54h124v-54c18-12 30-32 30-54v-10c-4-48-44-86-92-86z"/>
    <!-- ear tufts -->
    <path d="M188 152l-28-44 52 24zm136 0l28-44-52 24z" fill="#e8d5a8" stroke-width="3"/>
    <!-- eyes -->
    <circle cx="218" cy="232" r="36" fill="#f5f0e6" stroke="#152f42" stroke-width="5"/>
    <circle cx="294" cy="232" r="36" fill="#f5f0e6" stroke="#152f42" stroke-width="5"/>
    <circle cx="218" cy="232" r="14" fill="#1e405a"/>
    <circle cx="294" cy="232" r="14" fill="#1e405a"/>
    <circle cx="224" cy="226" r="5" fill="#fff" opacity="0.9"/>
    <circle cx="300" cy="226" r="5" fill="#fff" opacity="0.9"/>
    <!-- beak -->
    <path d="M256 248l-22 28h44z" fill="#c9a75f"/>
  </g>
  <!-- breast feathers hint -->
  <path d="M220 328c24 20 52 20 72 0" fill="none" stroke="#152f42" stroke-width="3" stroke-opacity="0.35" stroke-linecap="round"/>
  <!-- base / plinth -->
  <path d="M176 396h160v24c0 12-36 22-80 22s-80-10-80-22v-24z" fill="url(#gold)" stroke="#152f42" stroke-width="4"/>
</svg>
