[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polish-frequency"
version = "0.1.0"
description = "Reproducible SUBTLEX-PL + KWJP Polish lemma frequency candidates"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
polish-frequency = "src.build_frequency_list:main"

[tool.setuptools]
packages = ["src", "src.sources"]

