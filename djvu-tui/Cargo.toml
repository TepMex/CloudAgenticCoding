[package]
name = "djvu-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A monochrome, character-only DjVu viewer for Unix terminals"
license = "MIT"

[dependencies]
djvu-rs = { version = "=0.44.0", default-features = false, features = ["std"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
signal-hook = "0.3"

[profile.release]
lto = "thin"
strip = true

