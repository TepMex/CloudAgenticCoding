name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Explicit token avoids intermittent "could not read Username" fetch failures.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (socratus)
        working-directory: socratus
        run: bun install --frozen-lockfile

      - name: Install dependencies (mandarin-koan)
        working-directory: mandarin-koan
        run: bun install --frozen-lockfile

      - name: Install dependencies (hanzi-info)
        working-directory: hanzi-info
        run: bun install --frozen-lockfile

      - name: Install dependencies (hanzi-reading-roguelike)
        working-directory: hanzi-reading-roguelike
        run: bun install --frozen-lockfile

      # Project pages are served from /<repo>/, so hashed assets must use
      # /<repo>/<app>/ — not /<app>/ (that resolves to the org/user site root).
      - name: Set deployment timestamp
        run: echo "DEPLOYED_AT=$(date -u +"%Y-%m-%dT%H:%M:%S UTC")" >> "$GITHUB_ENV"

      - name: Build (socratus)
        working-directory: socratus
        env:
          GH_PAGES_PUBLIC_PATH: /${{ github.event.repository.name }}/socratus/
        run: bun run build

      - name: Build (mandarin-koan)
        working-directory: mandarin-koan
        env:
          GH_PAGES_PUBLIC_PATH: /${{ github.event.repository.name }}/mandarin-koan/
        run: bun run build

      - name: Build (hanzi-info)
        working-directory: hanzi-info
        env:
          GH_PAGES_PUBLIC_PATH: /${{ github.event.repository.name }}/hanzi-info/
        run: bun run build

      - name: Build (hanzi-reading-roguelike)
        working-directory: hanzi-reading-roguelike
        env:
          GH_PAGES_PUBLIC_PATH: /${{ github.event.repository.name }}/hanzi-reading-roguelike/
        run: bun run build

      - name: Setup Java (ChessWatch)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK (ChessWatch)
        uses: android-actions/setup-android@v3

      - name: Build ChessWatch APK
        working-directory: chesswatch
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Build AnkiDroid LLM APK
        working-directory: ankidroid-llm
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Build Local TTS APK
        working-directory: local-tts
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Build Anki Dashboard APK
        working-directory: anki-dashboard-apk
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Build ZuoTasks APK
        working-directory: zuo-tasks
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK sideload signing
        run: |
          chmod +x android/verify-apk-sideload-cert.sh
          android/verify-apk-sideload-cert.sh chesswatch/app/build/outputs/apk/release/app-release.apk
          android/verify-apk-sideload-cert.sh ankidroid-llm/app/build/outputs/apk/release/app-release.apk
          android/verify-apk-sideload-cert.sh local-tts/app/build/outputs/apk/release/app-release.apk
          android/verify-apk-sideload-cert.sh anki-dashboard-apk/app/build/outputs/apk/release/app-release.apk
          android/verify-apk-sideload-cert.sh zuo-tasks/app/build/outputs/apk/release/app-release.apk

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p deploy/socratus deploy/mandarin-koan deploy/hanzi-info deploy/hanzi-reading-roguelike deploy/chesswatch deploy/ankidroid-llm deploy/local-tts deploy/anki-dashboard-apk deploy/zuo-tasks
          cp -r socratus/dist/. deploy/socratus/
          cp -r mandarin-koan/dist/. deploy/mandarin-koan/
          cp -r hanzi-info/dist/. deploy/hanzi-info/
          cp -r hanzi-reading-roguelike/dist/. deploy/hanzi-reading-roguelike/
          for app in chesswatch ankidroid-llm local-tts anki-dashboard-apk zuo-tasks; do
            cp -r "$app/site/." "deploy/$app/"
            cp android/landing/styles.css "deploy/$app/styles.css"
          done
          cp chesswatch/app/build/outputs/apk/release/app-release.apk deploy/chesswatch/chesswatch.apk
          cp ankidroid-llm/app/build/outputs/apk/release/app-release.apk deploy/ankidroid-llm/ankidroid-llm.apk
          cp local-tts/app/build/outputs/apk/release/app-release.apk deploy/local-tts/local-tts.apk
          cp anki-dashboard-apk/app/build/outputs/apk/release/app-release.apk deploy/anki-dashboard-apk/anki-dashboard-apk.apk
          cp zuo-tasks/app/build/outputs/apk/release/app-release.apk deploy/zuo-tasks/zuo-tasks.apk
          touch deploy/.nojekyll

      - name: Inject deploy footers (static landing pages)
        run: |
          bun run scripts/inject-static-site-footer.ts \
            deploy/chesswatch/index.html \
            deploy/ankidroid-llm/index.html \
            deploy/local-tts/index.html \
            deploy/anki-dashboard-apk/index.html \
            deploy/zuo-tasks/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
